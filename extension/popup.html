<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Link Vault</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Link Vault</h1>
    <p id="pageTitle" class="page-title">Loading current tab...</p>
    <label>
      Note (optional)
      <input id="note" type="text" placeholder="Why this is useful" />
    </label>
    <label>
      API URL
      <input id="apiUrl" type="text" value="http://127.0.0.1:8787" />
    </label>
    <button id="saveBtn" class="primary">Save this page</button>
    <p id="status"></p>
    <a id="openDashboard" href="http://127.0.0.1:8787" target="_blank">Open dashboard</a>
    <script src="popup.js"></script>
  </body>
</html>
